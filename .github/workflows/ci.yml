name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Audit Python dependencies
        run: >-
          uvx pip-audit==2.10.1
          --path .venv/lib/python3.13/site-packages
          --progress-spinner off

      - name: Scan Python security issues
        run: uvx bandit==1.9.4 -r src

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Test with branch coverage
        run: uv run pytest --cov=src --cov-branch --cov-report=term-missing
