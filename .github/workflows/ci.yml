name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Audit Python dependencies
        run: >-
          uvx pip-audit==2.10.1
          --path .venv/lib/python3.13/site-packages
          --progress-spinner off

      - name: Scan Python security issues
        run: uvx bandit==1.9.4 -r src

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type-check
        run: uv run --group eval mypy src tests evals

      - name: Test with branch coverage
        run: uv run pytest --cov=src --cov-branch --cov-report=term-missing
