[project]
name = "personal-ai-assistent"
version = "0.1.0"
description = "Telegram ai assistent that helps remember stuff and create tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "aiogram>=3.30.0",
    "cryptography>=46.0.5",
    "fastapi>=0.128.0",
    "google-api-python-client>=2.190.0",
    "google-auth-oauthlib>=1.3.0",
    "httpx>=0.28.1",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tzdata>=2025.2",
    "uvicorn>=0.40.0",
    "graphiti-core>=0.30.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.2",
]
eval = [
    "deepeval>=3.9.9,<4",
    "reportlab>=4.4.4",
    "types-reportlab>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.ruff]
line-length = 88
target-version = "py313"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = ["E501"]


[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-p no:deepeval --strict-markers -m 'not integration'"
markers = [
    "llm_eval: paid, live LLM calls; requires --run-llm-evals",
    "integration: live Neo4j and LLM provider; run with make test-integration",
]
