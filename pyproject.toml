[project]
name = "personal-ai-assistent"
version = "0.1.0"
description = "Telegram ai assistent that helps remember stuff and create tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.30.0",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.ruff]
line-length = 88
target-version = "py313"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.mypy]
python_version = "3.13"
strict = true
